services:
  - type: web
    name: algorithmic
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algorithmic-postgres
          property: connectionString
    disk:
      name: algorithmic-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: algorithmic-postgres
    databaseName: algorithmic
    user: algorithmic
    plan: free
